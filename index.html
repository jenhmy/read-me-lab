<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ReadMeLab</title>
<link rel="stylesheet" href="estilo.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">
</head>

<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="ic-align-left" viewBox="0 0 16 16"><rect x="1" y="2.2" width="14" height="1.5" rx=".75"/><rect x="1" y="6.2" width="9" height="1.5" rx=".75"/><rect x="1" y="10.2" width="14" height="1.5" rx=".75"/><rect x="1" y="14.2" width="9" height="1.5" rx=".75"/></symbol>
    <symbol id="ic-align-center" viewBox="0 0 16 16"><rect x="1" y="2.2" width="14" height="1.5" rx=".75"/><rect x="3.5" y="6.2" width="9" height="1.5" rx=".75"/><rect x="1" y="10.2" width="14" height="1.5" rx=".75"/><rect x="3.5" y="14.2" width="9" height="1.5" rx=".75"/></symbol>
    <symbol id="ic-align-right" viewBox="0 0 16 16"><rect x="1" y="2.2" width="14" height="1.5" rx=".75"/><rect x="6" y="6.2" width="9" height="1.5" rx=".75"/><rect x="1" y="10.2" width="14" height="1.5" rx=".75"/><rect x="6" y="14.2" width="9" height="1.5" rx=".75"/></symbol>
  </defs>
</svg>
<header class="topbar">
  <h1>ReadMe<span class="accent">Lab</span><span class="for">for GitHub</span></h1>
</header>

<div class="actions">
  <button id="btnImport" title="Paste existing Markdown and keep editing it here"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M9.6 2.4h2.6a1.4 1.4 0 0 1 1.4 1.4v8.4a1.4 1.4 0 0 1-1.4 1.4H9.6" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><path d="M2.2 8h7M6.6 5.4 9.2 8l-2.6 2.6" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Import<span class="wide-only"> Markdown</span></span></button>
  <button id="btnCopy"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="5.2" y="1.4" width="9.4" height="10.4" rx="1.6" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M10.8 14.6H3a1.6 1.6 0 0 1-1.6-1.6V4.6" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg><span>Copy<span class="wide-only"> Markdown</span></span></button>
  <button id="btnDownload"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.6v8.2m0 0 3-3M8 9.8l-3-3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M2.2 13.4h11.6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg><span>Download<span class="wide-only"> .md</span></span></button>
</div>

<nav class="tabs" id="tabs">
  <button class="tab active" data-tab="text">Text</button>
  <button class="tab" data-tab="media">Media</button>
  <!-- Undo, redo and clear buttons -->
  <div class="doc-actions">
    <button id="btnTemplate" title="Load a sample document with every feature"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M8 7.2v4.4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="8" cy="4.8" r=".9" fill="currentColor"/></svg></button>
    <button id="btnUndo" title="Undo (Ctrl+Z)"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.6 8.2a5.6 5.6 0 1 1 1.9 4.2" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="M2.3 4.3v4h4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <button id="btnRedo" title="Redo (Ctrl+Y)"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M13.4 8.2a5.6 5.6 0 1 0-1.9 4.2" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="M13.7 4.3v4h-4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <button id="btnClear" class="danger" title="Clear all"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.6 4.2h10.8M6.2 4.2V2.8a1 1 0 0 1 1-1h1.6a1 1 0 0 1 1 1v1.4" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><path d="M3.9 4.2h8.2l-.7 9a1.3 1.3 0 0 1-1.3 1.2H5.9a1.3 1.3 0 0 1-1.3-1.2Z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M6.7 7v4.4M9.3 7v4.4" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg><span class="wide-only">Clear all </span></button>
  </div>
</nav>

<div class="toolbar" id="toolbar">

  <div class="panel active" data-panel="text">
    <div class="group" data-label="Heading">
      <button data-cmd="h1" title="Heading 1">H1</button>
      <button data-cmd="h2" title="Heading 2">H2</button>
      <button data-cmd="h3" title="Heading 3">H3</button>
      <button data-cmd="h4" title="Heading 4">H4</button>
      <button data-cmd="h5" title="Heading 5">H5</button>
      <button data-cmd="h6" title="Heading 6">H6</button>
    </div>
    <div class="group" data-label="Font">
      <button data-cmd="bold" title="Bold (Ctrl+B)"><b>B</b></button>
      <button data-cmd="italic" title="Italic (Ctrl+I)"><i>I</i></button>
      <button data-cmd="strike" title="Strikethrough"><s>S</s></button>
      <button data-cmd="code" title="Inline code">&lt;/&gt;</button>
      <button data-cmd="sub" title="Subscript">X<sub>2</sub></button>
      <button data-cmd="sup" title="Superscript">X<sup>2</sup></button>
    </div>
    <div class="group" data-label="Lists">
      <button data-cmd="ul" title="Bullet list"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="2.3" cy="3.2" r="1.2"/><rect x="5" y="2.45" width="10" height="1.5" rx=".75"/><circle cx="2.3" cy="8" r="1.2"/><rect x="5" y="7.25" width="10" height="1.5" rx=".75"/><circle cx="2.3" cy="12.8" r="1.2"/><rect x="5" y="12.05" width="10" height="1.5" rx=".75"/></svg></button>
      <button data-cmd="ol" title="Numbered list"><svg viewBox="0 0 16 16" aria-hidden="true"><text x="0" y="4.9" font-size="5.2" fill="currentColor">1.</text><text x="0" y="9.9" font-size="5.2" fill="currentColor">2.</text><text x="0" y="14.9" font-size="5.2" fill="currentColor">3.</text><rect x="6.6" y="2.5" width="8.9" height="1.4" rx=".7"/><rect x="6.6" y="7.5" width="8.9" height="1.4" rx=".7"/><rect x="6.6" y="12.5" width="8.9" height="1.4" rx=".7"/></svg></button>
      <button data-cmd="task" title="Task to do"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="1.6" y="1.6" width="12.8" height="12.8" rx="2.4" fill="none" stroke="currentColor" stroke-width="1.5"/></svg></button>
      <button data-cmd="task-done" title="Task done"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="1.6" y="1.6" width="12.8" height="12.8" rx="2.4" fill="#c9d1d9" stroke="#c9d1d9" stroke-width="1.5"/><path d="m4.4 8.2 2.5 2.6 4.7-5" fill="none" stroke="#0d1117" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </div>
    <div class="group" data-label="Blocks">
      <button data-cmd="quote" title="Add a quote level">❝+</button>
      <button data-cmd="quote-out" title="Remove a quote level">❝−</button>
      <button data-cmd="hr" title="Horizontal line">―</button>
      <button data-cmd="table" title="Insert a table"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="1" y="2.5" width="14" height="11" rx="1.3" fill="none" stroke="currentColor" stroke-width="1.3"/><rect x="1" y="5.6" width="14" height="1.3"/><rect x="5.9" y="5.6" width="1.3" height="7.9"/><rect x="10.3" y="5.6" width="1.3" height="7.9"/></svg></button>
      <button data-cmd="table-center" title="Center the table on the page"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M1.2 2.4v11.2M14.8 2.4v11.2" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" opacity=".5"/><rect x="4.5" y="4" width="7" height="8" rx="1" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M4.5 6.7h7M8 6.7v5.3" fill="none" stroke="currentColor" stroke-width="1.2"/></svg></button>
      <button data-cmd="details" title="Collapsible section"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.6 4.2 5.4 7 2.6 9.8" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="7.4" y="3.2" width="7.6" height="1.5" rx=".75"/><rect x="7.4" y="6.25" width="7.6" height="1.5" rx=".75"/><rect x="2.6" y="11.5" width="12.4" height="1.5" rx=".75" opacity=".55"/></svg></button>
    </div>
    <div class="group" data-label="Align">
      <button data-cmd="align-left" title="Align left"><svg viewBox="0 0 16 16" aria-hidden="true"><use href="#ic-align-left"/></svg></button>
      <button data-cmd="align-center" title="Align center"><svg viewBox="0 0 16 16" aria-hidden="true"><use href="#ic-align-center"/></svg></button>
      <button data-cmd="align-right" title="Align right"><svg viewBox="0 0 16 16" aria-hidden="true"><use href="#ic-align-right"/></svg></button>
    </div>
    <div class="group" data-label="Insert">
      <button data-cmd="link" title="Insert link (Ctrl+K)"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6.5 9.5a3 3 0 0 0 4.24 0l2-2a3 3 0 1 0-4.24-4.25l-.9.9" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><path d="M9.5 6.5a3 3 0 0 0-4.24 0l-2 2a3 3 0 1 0 4.24 4.25l.9-.9" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg></button>
      <button data-cmd="toc" title="Build a table of contents from the headings you wrote"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 1.9h8a1 1 0 0 1 1 1v11.3l-5-2.9-5 2.9V2.9a1 1 0 0 1 1-1Z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg></button>
    </div>
  </div>

  <div class="panel" data-panel="media">
    <div class="group" data-label="Characters">
      <button data-cmd="emoji" title="Insert emoji">😀</button>
      <button data-cmd="symbol" title="Insert symbol (♡ ★ → ✓ ─)">♡</button>
    </div>
    <div class="group" data-label="Image">
      <button data-cmd="image" title="Insert image (link only, no uploads)"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="1" y="2.5" width="14" height="11" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.3"/><circle cx="5.3" cy="6.4" r="1.25"/><path d="M2.6 12.2 6 8.6l2.4 2.5L11 7.9l2.5 4.3Z"/></svg></button>
      <button data-cmd="image-align-left" title="Align the selected image left"><svg viewBox="0 0 16 16" aria-hidden="true"><use href="#ic-align-left"/></svg></button>
      <button data-cmd="image-align-center" title="Align the selected image center"><svg viewBox="0 0 16 16" aria-hidden="true"><use href="#ic-align-center"/></svg></button>
      <button data-cmd="image-align-right" title="Align the selected image right"><svg viewBox="0 0 16 16" aria-hidden="true"><use href="#ic-align-right"/></svg></button>
      <button data-cmd="gallery" title="Several images side by side in one row"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="1" y="3.5" width="6" height="9" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.3"/><rect x="9" y="3.5" width="6" height="9" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.3"/></svg></button>
    </div>
    <div class="group" data-label="Simple visuals">
      <button data-cmd="badge" title="Insert badge"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8.3 1.7H14a.8.8 0 0 1 .8.8v5.7a1 1 0 0 1-.3.7l-5.6 5.6a1 1 0 0 1-1.4 0L1.8 8.8a1 1 0 0 1 0-1.4l5.8-5.4a1 1 0 0 1 .7-.3Z" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linejoin="round"/><circle cx="11.4" cy="4.8" r="1.25"/></svg></button>
      <button data-cmd="progress" title="Progress bar"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="1" y="5.5" width="14" height="5" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.35"/><rect x="2.9" y="7.4" width="6" height="1.2" rx=".6"/></svg></button>
      <button data-cmd="skillicons" title="Tech icons"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="1" y="1.4" width="6" height="6" rx="1.4" fill="none" stroke="currentColor" stroke-width="1.35"/><rect x="9" y="1.4" width="6" height="6" rx="1.4" fill="none" stroke="currentColor" stroke-width="1.35"/><rect x="1" y="8.6" width="6" height="6" rx="1.4" fill="none" stroke="currentColor" stroke-width="1.35"/><rect x="9" y="8.6" width="6" height="6" rx="1.4" fill="none" stroke="currentColor" stroke-width="1.35"/></svg></button>
      <button data-cmd="qr" title="QR code"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M1.2 5.4V2.6a1.4 1.4 0 0 1 1.4-1.4h2.8M10.6 1.2h2.8a1.4 1.4 0 0 1 1.4 1.4v2.8M14.8 10.6v2.8a1.4 1.4 0 0 1-1.4 1.4h-2.8M5.4 14.8H2.6a1.4 1.4 0 0 1-1.4-1.4v-2.8" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><rect x="4.4" y="4.4" width="3" height="3" rx=".6"/><rect x="8.6" y="4.4" width="3" height="3" rx=".6"/><rect x="4.4" y="8.6" width="3" height="3" rx=".6"/><rect x="8.6" y="8.6" width="1.3" height="1.3" rx=".3"/><rect x="10.3" y="10.3" width="1.3" height="1.3" rx=".3"/></svg></button>
    </div>
    <div class="group" data-label="Headers">
      <button data-cmd="banner" title="Banner"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="1" y="2.6" width="14" height="10.8" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.35"/><path d="M1.6 10.2c1.6-2.4 3.2-2.4 4.8 0s3.2 2.4 4.8 0 3.2-2.4 3.2 0" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round"/></svg></button>
      <button data-cmd="typing" title="Typing animated text"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="1" y="4.2" width="7.4" height="1.5" rx=".75"/><rect x="1" y="7.6" width="10.4" height="1.5" rx=".75"/><rect x="1" y="11" width="5.4" height="1.5" rx=".75"/><rect x="12.9" y="2.6" width="1.6" height="11.4" rx=".4"/></svg></button>
    </div>
    <div class="group" data-label="Live stats">
      <button data-cmd="views" title="Profile views counter"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M1.2 8S3.9 3.4 8 3.4 14.8 8 14.8 8 12.1 12.6 8 12.6 1.2 8 1.2 8Z" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linejoin="round"/><circle cx="8" cy="8" r="2.1" fill="none" stroke="currentColor" stroke-width="1.35"/></svg></button>
      <button data-cmd="activity" title="GitHub activity card"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="1" y="2.2" width="14" height="11.6" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.35"/><rect x="3.3" y="8.6" width="1.7" height="3.1" rx=".6"/><rect x="6.4" y="6.4" width="1.7" height="5.3" rx=".6"/><rect x="9.5" y="4.4" width="1.7" height="7.3" rx=".6"/></svg></button>
      <button data-cmd="streak" title="Commit streak"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.4s.6 2.4-1.1 4.1C5.2 7.2 3.4 8.3 3.4 10.6a4.6 4.6 0 0 0 9.2 0c0-2.1-1.3-3.3-2-4.6-.4 1-.9 1.5-1.6 1.9.5-2.2-.3-4.7-1-6.5Z" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linejoin="round"/></svg></button>
    </div>
  </div>

</div>

<main class="workspace">
  <div class="mobile-switch" id="mobileSwitch">
    <button class="switch-btn active" data-view="editor">Editor</button>
    <button class="switch-btn" data-view="output">Markdown</button>
  </div>
  <section class="pane pane-editor" id="paneEditor">
    <div id="editor" class="editor" contenteditable="true" spellcheck="true"
         data-placeholder="Start writing here…"></div>
  </section>
  <section class="pane pane-output" id="paneOutput">
    <div class="output-head">
      <span>Markdown output</span>
    </div>
    <pre id="output" class="output" aria-readonly="true"></pre>
  </section>
</main>


<div id="modalOverlay" class="modal-overlay hidden">
  <div class="modal" id="modal"></div>
</div>

<div id="toast" class="toast hidden"></div>

<script src="plantilla.js"></script>
<script src="editor.js"></script>
</body>
</html>
